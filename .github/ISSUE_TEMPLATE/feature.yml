name: Feature / unit of work
description: A piece of work for one milestone (half a day to two days)
labels: ["type:feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and how it fits the plan (docs/PLAN.md).
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions, including the numbers to produce and where they are saved.
      value: |
        - [ ]
    validations:
      required: true
