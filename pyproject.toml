[project]
name = "clinical-rag-eval"
version = "0.1.0"
description = "A measured biomedical RAG pipeline on PubMedQA: BM25 vs dense vs Qdrant hybrid vs reranking, with retrieval metrics, RAGAS, a validated LLM judge and per-stage latency."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arjun Sivasankar" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.25",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
crag = "clinical_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: needs a CUDA GPU (skipped in CI)",
    "slow: downloads models or data (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110"]
